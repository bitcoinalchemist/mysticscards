<script>
  // Keep Saved Birthdays available while an older cached finder-trays script
  // is being replaced. The module owns the normal path; this only runs if it
  // did not expose its tray helper.
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof window.toggleFinderTray === 'function') return;
    const button = document.getElementById('finderBdayBtn');
    const tray = document.getElementById('bdayTrayWrap');
    if (!button || !tray) return;
    button.addEventListener('click', function () {
      const opening = !tray.classList.contains('open');
      if (opening && typeof window.prepareBirthTray === 'function') window.prepareBirthTray();
      tray.classList.toggle('open', opening);
      button.classList.toggle('is-active', opening);
      button.setAttribute('aria-expanded', opening ? 'true' : 'false');
    });
  });
</script>
<script src="js/planetdata.js?v=20260923a"></script>
<main id="main" tabindex="-1">
  <h1 class="vh">Mystics Cards — Cardology</h1>
  <section class="finder page-section section-open" id="finder" aria-labelledby="finderHeading">
    <h2 class="vh" id="finderHeading">Finder</h2>
    <div class="section-bodywrap">
        <div class="section-bodymin" id="finderBody">
          <div class="section-shell">
          <div class="finder-persons">
            <fieldset class="finder-person" data-role="you">
              <legend class="vh">You</legend>
              <div class="finder-inputs">
                <div class="finder-datepair">
                  <label class="finder-select-wrap">
                    <input id="fDay" class="finder-select finder-day-input" type="text"
                           maxlength="2" inputmode="numeric" pattern="[0-9]*"
                           placeholder="DD" aria-label="Your birth day">
                  </label>
                  <span class="finder-datepair-slash" aria-hidden="true">/</span>
                  <label class="finder-select-wrap">
                    <input id="fMonth" class="finder-select finder-day-input" type="text"
                           maxlength="2" inputmode="numeric" pattern="[0-9]*"
                           placeholder="MM" aria-label="Your birth month">
                  </label>
                </div>
              </div>
            </fieldset>
            <fieldset class="finder-person" data-role="partner">
              <legend class="vh">Partner</legend>
              <div class="finder-inputs">
                <div class="finder-datepair">
                  <label class="finder-select-wrap">
                    <input id="fpDay" class="finder-select finder-day-input" type="text"
                           maxlength="2" inputmode="numeric" pattern="[0-9]*"
                           placeholder="DD" aria-label="Partner's birth day">
                  </label>
                  <span class="finder-datepair-slash" aria-hidden="true">/</span>
                  <label class="finder-select-wrap">
                    <input id="fpMonth" class="finder-select finder-day-input" type="text"
                           maxlength="2" inputmode="numeric" pattern="[0-9]*"
                           placeholder="MM" aria-label="Partner's birth month">
                  </label>
                </div>
              </div>
            </fieldset>
          </div>

          <!-- Finder tools load inline under the Finder controls. -->
          <div class="finder-tools">
            <button type="button" id="fDateReset" class="finder-tool-btn finder-tool-btn--icon finder-date-reset"
                    aria-label="Restore selected date" title="Restore selected date" hidden>↻</button>
            <button type="button" id="fRelToggle" class="finder-tool-btn finder-tool-btn--icon finder-rel-toggle"
                    title="Add partner" aria-label="Add partner" aria-pressed="false">+</button>
            <button type="button" id="finderBdayBtn" class="finder-tool-btn finder-tool-btn--icon"
                    title="Contacts" aria-label="Contacts" aria-expanded="false" aria-controls="bdayTrayWrap">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2h8v12l-4-3-4 3V2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              <span class="finder-tool-badge" id="finderBdayBadge"></span>
            </button>
            <button type="button" id="finderShareBtn" class="finder-tool-btn finder-tool-btn--icon finder-share-btn"
                    title="Share Finder link" aria-label="Share Finder link" hidden>
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="5" cy="8" r="1.55" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="11.5" cy="4" r="1.55" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="11.5" cy="12" r="1.55" stroke="currentColor" stroke-width="1.4"/>
                <path d="M6.35 7.2l3.75-2.3M6.35 8.8l3.75 2.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>

          <div class="finder-tray-wrap" id="bdayTrayWrap">
            <div class="finder-tray-min">
              <div class="finder-tray bday-tray">
                <div class="bday-inline-head">
                  <span class="bday-inline-title">Contacts</span>
                </div>
                <div class="pick-target" id="bdayTarget" hidden>
                  <button type="button" class="pick-target-btn is-active" id="bdayTargetSelf" data-target="self">Player 1</button>
                  <button type="button" class="pick-target-btn" id="bdayTargetPartner" data-target="partner">Player 2</button>
                </div>
                <div class="bday-toolbar">
                  <div class="bday-io">
                    <button class="btn btn--gold" id="bdayAddBtn" type="button">+ Add contact</button>
                    <button class="btn" id="bdayImportBtn" type="button" title="Import a contacts file">Import</button>
                    <button class="btn" id="bdayExportBtn" type="button" title="Download your contacts">Export</button>
                    <button class="bday-info-btn" id="bdayInfoBtn" type="button" aria-expanded="false" aria-controls="bdayNote" aria-label="About contacts">i</button>
                    <input type="file" id="bdayImportFile" accept="application/json" hidden>
                  </div>
                </div>
                <p class="bday-note" id="bdayNote" hidden>Contacts are saved in this browser only. Export to back up or move to another device.</p>
                <div class="bday-search" id="bdaySearchWrap" hidden>
                  <input type="search" id="bdaySearch" placeholder="Search Contacts" aria-label="Search Contacts" autocomplete="off">
                </div>
                <div class="bday-tag-filters" id="bdayTagFilters" hidden role="group" aria-label="Filter contacts by tag"></div>
                <div class="birth-add-panel" id="birthAddPanel">
                  <div class="birth-add-row">
                    <input type="text" id="baDay" class="ba-field ba-num" maxlength="2" inputmode="numeric" placeholder="DD" aria-label="Day">
                    <input type="text" id="baMonth" class="ba-field ba-num" maxlength="2" inputmode="numeric" placeholder="MM" aria-label="Month">
                    <input type="text" id="baYear" class="ba-field ba-year" maxlength="4" inputmode="numeric" placeholder="YYYY" aria-label="Year">
                    <input type="text" id="baName" class="ba-field ba-name" placeholder="Name" aria-label="Name">
                    <button type="button" class="btn btn--gold" id="birthAddSave">Save</button>
                  </div>
                  <label class="ba-detail-field birth-tags-field">
                    <span>Tags</span>
                    <span class="birth-tag-picker" id="baTagPicker" role="group" aria-label="Contact tags"></span>
                  </label>
                  <p class="birth-add-error" id="birthAddError" aria-live="polite"></p>
                </div>
                <div class="bday-list" id="birthPanel"></div>
                <div class="bday-pager" id="bdayPager" hidden aria-label="Contacts pages"></div>
              </div>
            </div>
          </div>

          <div class="quadrations-inline utility-slide-panel" id="qInlinePanel" hidden>
            <div class="utility-slide-min">
            <section class="quadrations page-section section-open" id="quadrations" aria-label="Spreads">
              <div class="section-bodywrap">
                <div class="section-bodymin" id="quadrationsBody">
                  <div class="section-shell">
                    <div class="spreads-top">
                      <div class="q-chart-toolbar" aria-label="Spread controls">
                        <div class="q-chart-age age-controls" role="group" aria-label="Spread age">
                          <button type="button" class="age-btn" id="ageDown" aria-label="Previous age">−</button>
                          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="ageInput" class="age-input" value="0" aria-label="Age (0–89)">
                          <button type="button" class="age-btn" id="ageUp" aria-label="Next age">+</button>
                        </div>
                        <button type="button" class="q-menu-toggle" id="qMenu" aria-label="Spreads options" aria-expanded="false" aria-controls="qControlsMenu">
                          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M7 14v6"/></svg>
                        </button>
                      </div>
                      <span class="q-mode-current" id="qModeCurrent" aria-live="polite"></span>
                    </div>
                    <div class="spread-layout">
                      <div class="spread-wrap">
                        <div class="spread-stack">
                          <div id="annualGrid" class="spread-grid"></div>
                        </div>
                      </div>
                    </div>
                    <div class="age-controls-wrap q-controls-menu" id="qControlsMenu" aria-label="Spreads menu" hidden>
                      <fieldset class="q-control-group q-size-stepper">
                        <legend>Chart size</legend>
                        <div class="age-controls">
                          <button type="button" class="age-btn" id="qSizeDown" aria-label="Decrease chart size">−</button>
                          <label class="q-size-value">
                            <input type="number" id="qSize" class="age-input" min="60" max="120" step="5" value="100" aria-label="Chart size percent">
                            <span class="q-size-unit" aria-hidden="true">%</span>
                          </label>
                          <button type="button" class="age-btn" id="qSizeUp" aria-label="Increase chart size">+</button>
                        </div>
                        <div class="q-size-slider-row">
                          <span aria-hidden="true">60%</span>
                          <input type="range" id="qSizeSlider" min="60" max="120" step="5" value="100" aria-label="Chart size slider">
                          <span aria-hidden="true">120%</span>
                        </div>
                      </fieldset>
                      <fieldset class="q-control-group q-display-group">
                        <legend>Display</legend>
                        <div class="q-display-toggles">
                          <button type="button" class="q-disp-toggle q-solar-toggle" id="qSolar" role="switch" aria-checked="false">
                            <span class="q-toggle-icon" aria-hidden="true">☉</span><span>Solar Values</span><span class="q-switch-track" aria-hidden="true"></span>
                          </button>
                          <button type="button" class="q-disp-toggle" id="qDisp" role="switch" aria-checked="false">
                            <span class="q-toggle-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5.5 4.5h9v11h-9zM9.5 8.5h9v11h-9z"/><path d="m7 18 2.2 2.2L11.5 18M17 6l-2.2-2.2L12.5 6"/></svg></span><span>Displacements</span><span class="q-switch-track" aria-hidden="true"></span>
                          </button>
                          <button type="button" class="q-disp-toggle q-alt-toggle" id="qAlt" role="switch" aria-checked="false">
                            <span class="q-toggle-icon" aria-hidden="true">♛</span><span>Pips Only</span><span class="q-switch-track" aria-hidden="true"></span>
                          </button>
                        </div>
                      </fieldset>
                    </div>
                  </div>
                </div>
              </div>
            </section>
            </div>
          </div>

          <section class="info-inline utility-slide-panel" id="shInfoPanel" aria-label="About" hidden></section>

          <div class="finder-results">
            <div class="finder-result" id="fResult" aria-live="polite"></div>
            <div class="finder-result finder-result-composite" id="frResult" aria-live="polite"></div>
            <div class="finder-result" id="fpResult" aria-live="polite"></div>
          </div>

          <!-- Finder reading. Cycles now lives in the shared dock as its own view. -->
          <div class="finder-panels" id="fPanels" hidden>
            <!-- About — the personal card reading. -->
            <section class="finder-reading-panel finder-about" id="fAbout" tabindex="0">
                <div class="finder-about-inner">
                  <div class="finder-about-view finder-about-modern is-active" id="fAboutModern">
                  <div class="finder-about-card-heading">
                    <h3 id="fAboutCardHeading"></h3>
                    <p class="finder-about-card-note" id="fAboutCardNote" hidden></p>
                  </div>
                  <div class="finder-card-facts" id="fAboutCardFacts" aria-label="Details"></div>
                  <div class="finder-about-personality" id="fAboutPersonality"></div>
                  <div class="finder-about-lifescript relationship-connections" id="fRelationshipConnections"></div>
                  <div class="finder-about-longform" id="fAboutLongform"></div>
                  <div class="finder-about-lifescript finder-about-cardology" id="fAboutCardology"></div>
                  <div class="about-planet-info" id="fAboutPlanetInfo" hidden aria-live="polite"></div>
                  <div class="finder-modern-actions">
                    <button class="finder-modern-action-btn" id="fSolarToggle" type="button" aria-expanded="false" aria-controls="fSolar">Solar Time</button>
                    <button class="finder-modern-action-btn" id="fModernOlney" type="button" aria-expanded="false" aria-controls="fYenloPanel">Yenlo</button>
                  </div>
                  <section class="it-solar solar-time-adjustment" id="fSolar" aria-label="Solar Time" hidden>
                    <div class="it-solar-body" id="solBody">
                      <p class="it-solar-intro">Use the birth time and place to check whether the solar day changes the birth card.</p>
                      <div class="it-solar-fields">
                        <label class="it-solar-field"><span>Birth time</span>
                          <input type="time" id="solTime" step="60" aria-label="Birth time" />
                        </label>
                        <label class="it-solar-field"><span>Birthplace</span>
                          <input type="text" id="solPlace" list="solZoneList" placeholder="city or zone" autocomplete="off" aria-label="Birthplace" />
                        </label>
                      </div>
                      <datalist id="solZoneList"></datalist>
                      <div class="it-solar-out" id="solOut"></div>
                    </div>
                  </section>
                  <div class="finder-modern-yenlo" id="fYenloPanel" hidden aria-live="polite"><div class="olney-inner olney-panel"></div></div>
                  </div>
                </div>
            </section>
          </div>
          </div>
        </div>
      </div>
  </section>

</main>

  <!-- Promoted into their own dock views by js/site.js once the shared shell is ready. -->
  <section class="finder-intime is-empty" id="fInTime" aria-label="Cycles" hidden>
    <div class="it-inner"></div>
    <div class="it-empty">
      <figure class="it-displacement-figure">
        <div class="it-displacement-wheel" id="itDisplacementWheel"></div>
        <button class="it-wheel-favorites-toggle" type="button" data-it-favorites-toggle data-it-wheel-favorites-toggle aria-label="Show favourite birthdays" aria-expanded="false" aria-controls="itFavorites">☆</button>
        <div class="it-favorites" id="itFavorites" aria-label="Favourite birthdays" hidden></div>
      </figure>
    </div>
  </section>

  <nav class="utility-dock" aria-label="Main tools">
    <button type="button" class="utility-dock-btn is-active" id="dockFinder" data-dock-target="finder" aria-pressed="true">
      <span class="utility-dock-icon utility-dock-icon--finder" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <rect class="finder-icon-side" x="2.5" y="6" width="8" height="13" rx="1" transform="rotate(-8 6.5 12.5)" />
          <rect class="finder-icon-side" x="13.5" y="6" width="8" height="13" rx="1" transform="rotate(8 17.5 12.5)" />
          <rect class="finder-icon-main" x="8" y="4" width="8" height="15" rx="1" />
          <path class="finder-icon-mark" d="M12 8v7M9.5 11.5h5" />
        </svg>
      </span><span>Finder</span>
    </button>
    <button type="button" class="utility-dock-btn" id="dockCycles" data-dock-target="cycles" aria-pressed="false">
      <span class="utility-dock-icon utility-dock-icon--cycles" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M18.2 8.5A7 7 0 0 0 6 5.2" />
          <path d="M5.8 2.9v2.7h2.7M5.8 15.5A7 7 0 0 0 18 18.8" />
          <path d="M18.2 21.1v-2.7h-2.7" />
        </svg>
      </span><span>Cycles</span>
    </button>
    <button type="button" class="utility-dock-btn" id="qOpen" data-dock-target="quadrations" aria-pressed="false">
      <span class="utility-dock-icon utility-dock-icon--quad" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <rect x="10" y="3" width="4" height="4" rx=".5" />

          <rect x="10" y="8" width="4" height="4" rx=".5" />
          <rect x="15" y="8" width="4" height="4" rx=".5" />
          <rect x="5" y="13" width="4" height="4" rx=".5" />
          <rect x="10" y="13" width="4" height="4" rx=".5" />
          <rect x="15" y="13" width="4" height="4" rx=".5" />
          <rect x="5" y="18" width="4" height="4" rx=".5" />
          <rect x="10" y="18" width="4" height="4" rx=".5" />
          <rect x="15" y="18" width="4" height="4" rx=".5" />
        </svg>
      </span><span>Spreads</span>
    </button>
    <button type="button" class="utility-dock-btn" id="shInfoBtn" data-dock-target="info" aria-pressed="false">
      <span class="utility-dock-icon utility-dock-icon--about" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M12 6.5c-2.2-1.6-5.2-1.7-8-1.1v13c3-.6 5.8-.4 8 1.1 2.2-1.5 5-1.7 8-1.1v-13c-2.8-.6-5.8-.5-8 1.1Z" />
          <path d="M12 6.5v13M6.5 9.2c1.2-.1 2.3 0 3.2.4M6.5 12c1.2-.1 2.3 0 3.2.4M14.3 9.6c1-.4 2.1-.5 3.2-.4M14.3 12.4c1-.4 2.1-.5 3.2-.4" />
        </svg>
      </span><span>About</span>
    </button>
  </nav>
